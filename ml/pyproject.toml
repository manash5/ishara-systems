[project]
name = "ishara-ml"
version = "0.1.0"
description = "Ishara ML pipeline: MediaPipe hand landmarks -> NSL fingerspelling TFLite model + greeting DTW templates"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dtaidistance>=2.5.1",
    "imageio-ffmpeg>=0.8.1",
    "matplotlib>=3.11.2",
    "mediapipe>=1.2.3",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow==13.0.0",
    "rembg[cpu]>=2.0.88",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ishara_ml"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
